version: "3.9"

services:
  trigger-worker:
    build:
      context: ../tasks
      dockerfile: Dockerfile
    image: aurelius/trigger-worker:latest
    platform: linux/amd64
    depends_on:
      - minio
    environment:
      - NODE_ENV=production
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_USER=${MINIO_USER:-aurelius}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-changeme123}
      - OPA_ENDPOINT=http://opa:8181
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-20250514}
      - LOCAL_MODEL=${LOCAL_MODEL:-nemotron:latest}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    networks:
      - aurelius

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    volumes:
      - ../policies/compliance:/policies/compliance:ro
      - ../policies/proposal:/policies/proposal:ro
      - ../policies/constraints:/policies/constraints:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    restart: unless-stopped
    networks:
      - aurelius

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-aurelius}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-changeme123}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - aurelius

  nemotron:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - aurelius

  openshell:
    image: docker:dind
    privileged: true
    ports:
      - "2376:2376"
    volumes:
      - ../policies:/policies:ro
      - openshell_data:/workspace
    environment:
      DOCKER_TLS_CERTDIR: ""
    restart: unless-stopped
    networks:
      - aurelius

volumes:
  minio_data:
    driver: local
  ollama_data:
    driver: local
  openshell_data:
    driver: local

networks:
  aurelius:
    driver: bridge
